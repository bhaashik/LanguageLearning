name: Publish test packages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/testing-packages.yml
      - scripts/publish-testing-package.mjs
  workflow_dispatch:
    inputs:
      platform:
        description: Package to build (iOS is an unsigned device archive)
        type: choice
        options: [all, windows, android, ios]
        default: all
permissions:
  contents: read
concurrency:
  group: test-packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: node scripts/publish-testing-package.mjs windows building
      - run: npm run desktop:install
      - run: npm test
      - run: npm run desktop:package
      - run: node desktop/scripts/smoke.mjs
      - name: Archive Windows portable app
        shell: pwsh
        run: Compress-Archive -Path desktop/out/Bhaasa-win32-x64 -DestinationPath desktop/out/Bhaasa-windows-x64.zip
      - run: node scripts/publish-testing-package.mjs windows ready desktop/out/Bhaasa-windows-x64.zip
        env:
          BHAASA_PACKAGE_ARCH: x64
      - name: Record failed build
        if: failure()
        run: node scripts/publish-testing-package.mjs windows failed
  android:
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: node scripts/publish-testing-package.mjs android building
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: npm run mobile:install
      - run: npm test
      - run: npm run mobile:sync
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: mobile/android
      - run: node scripts/publish-testing-package.mjs android ready mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Record failed build
        if: failure()
        run: node scripts/publish-testing-package.mjs android failed
  ios:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BHAASA_BUILD_LOG: ${{ runner.temp }}/bhaasa-ios-build.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: node scripts/publish-testing-package.mjs ios building
      - run: xcodebuild -version
      - run: npm run mobile:install 2>&1 | tee "$BHAASA_BUILD_LOG"
      - run: npm test 2>&1 | tee -a "$BHAASA_BUILD_LOG"
      - run: npm run mobile:sync 2>&1 | tee -a "$BHAASA_BUILD_LOG"
      - name: Build unsigned iPhone and iPad archive
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -archivePath mobile/ios/archives/Bhaasa.xcarchive CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee -a "$BHAASA_BUILD_LOG"
      - name: Check device app and packaged lessons
        run: |
          test -f mobile/ios/archives/Bhaasa.xcarchive/Products/Applications/App.app/App
          test -f mobile/ios/archives/Bhaasa.xcarchive/Products/Applications/App.app/public/feedback-page.js
          lipo -verify_arch arm64 mobile/ios/archives/Bhaasa.xcarchive/Products/Applications/App.app/App
      - name: Package unsigned device archive
        run: ditto -c -k --sequesterRsrc --keepParent mobile/ios/archives/Bhaasa.xcarchive mobile/Bhaasa-iOS-unsigned.xcarchive.zip
      - run: node scripts/publish-testing-package.mjs ios ready mobile/Bhaasa-iOS-unsigned.xcarchive.zip
        env:
          BHAASA_PACKAGE_ARCH: arm64 (iPhone/iPad, unsigned)
      - name: Record failed build
        if: failure()
        run: node scripts/publish-testing-package.mjs ios failed

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Update WebView · Bhaasa</title><style>body{max-width:36em;margin:3em auto;padding:1em;background:#f8f8f2;color:#214d3c;font:18px/1.6 sans-serif}</style></head><body><h1>Update Android System WebView</h1><p>Bhaasa needs Android System WebView or Chrome version 109 or later. Update them through your device’s app store, then close and reopen Bhaasa.</p><p>Your saved lessons and progress remain in the app. Export a backup before clearing storage or uninstalling.</p></body></html>
